name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite runs on SQLite, but the app ships on PostgreSQL: a service
    # container means the migrations are exercised against the real thing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caflow
          POSTGRES_PASSWORD: caflow
          POSTGRES_DB: caflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: ci
      SECRET_KEY: ci-secret-not-used-in-production-0123456789
      DATABASE_URL: postgresql+psycopg://caflow:caflow@localhost:5432/caflow_ci
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Migrations apply to a real PostgreSQL
        run: alembic upgrade head

      - name: Migrations are reversible
        # A migration that cannot be rolled back is a deploy that cannot be
        # rolled back. Down to base and back up proves both directions.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Seed data loads
        run: python -m app.cli seed

      - name: Production config refuses to boot on placeholders
        # The guard that keeps a placeholder signing key out of production is
        # only worth having if something checks it still fires. Every other
        # setting here is valid, so SECRET_KEY is the only thing under test.
        run: |
          set +e
          output=$(ENVIRONMENT=production DEBUG=false \
            SECRET_KEY=change-me-in-production \
            PORTAL_BASE_URL=https://portal.example.in/portal \
            CORS_ORIGINS=https://app.example.in \
            python -c "import app.config" 2>&1)
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "::error::A placeholder SECRET_KEY was accepted in production"
            exit 1
          fi
          if ! echo "$output" | grep -q "SECRET_KEY is still a placeholder"; then
            echo "::error::Config was rejected, but not for the reason under test"
            echo "$output"
            exit 1
          fi
          echo "Rejected as expected."

  frontend:
    name: Frontend — lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # No point building images for a tree that does not pass its own tests.
    needs: [backend, frontend]

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: web
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: caflow-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Image starts and answers its liveness probe
        if: matrix.name == 'backend'
        run: |
          docker run -d --name caflow-api-smoke -p 8000:8000 \
            -e ENVIRONMENT=ci \
            -e SECRET_KEY=ci-secret-not-used-in-production-0123456789 \
            -e DATABASE_URL=postgresql+psycopg://nobody:nobody@127.0.0.1:5432/none \
            caflow-backend:ci
          # Liveness must answer even with no database behind it — that is the
          # whole point of separating it from readiness.
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live > /dev/null; then
              echo "Liveness OK after ${attempt}s"
              docker rm -f caflow-api-smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::The API image never became live"
          docker logs caflow-api-smoke
          exit 1

      # A header that is in nginx.conf is not yet a header the browser gets:
      # nginx drops every inherited add_header in a block that declares one of
      # its own, so a policy can be present in the file and absent from the
      # response. This asks the running container what it actually sends.
      - name: Image serves the app shell with its security headers
        if: matrix.name == 'web'
        run: |
          # nginx resolves upstream hostnames at startup and refuses to start
          # if one is unknown, so the API name has to point somewhere even
          # though nothing is proxied here.
          docker run -d --name caflow-web-smoke -p 8080:80 \
            --add-host api:127.0.0.1 caflow-web:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then
              echo "Serving after ${attempt}s"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::The web image never started serving"
              docker logs caflow-web-smoke
              docker rm -f caflow-web-smoke
              exit 1
            fi
            sleep 1
          done

          shell_headers=$(curl -fsS -D - -o /dev/null http://localhost:8080/)
          echo "$shell_headers"

          status=0
          for header in content-security-policy x-frame-options \
                        x-content-type-options referrer-policy permissions-policy; do
            if ! grep -qi "^${header}:" <<< "$shell_headers"; then
              echo "::error::The app shell went out without ${header}"
              status=1
            fi
          done

          # The bundle itself lives under /assets/, which declares its own
          # Cache-Control and so inherits nothing. That is exactly the case
          # where a header goes missing without anyone noticing.
          bundle=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::Could not find the bundle in the served index.html"
            status=1
          elif ! curl -fsS -D - -o /dev/null "http://localhost:8080${bundle}" \
               | grep -qi '^x-content-type-options:'; then
            echo "::error::${bundle} went out without X-Content-Type-Options"
            status=1
          fi

          docker logs caflow-web-smoke
          docker rm -f caflow-web-smoke
          exit $status

  deploy:
    name: Deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # These files are only ever exercised on the production box, by systemd,
    # at the moment someone is deploying. A typo in the overlay or the site
    # config is otherwise found by `systemctl start caflow` failing on a host
    # that is already serving — which is the worst place to find it.
    #
    # backend/tests/test_deployment.py asserts what these files *mean*; this
    # asserts that the tools which read them accept them at all.

    steps:
      - uses: actions/checkout@v4

      - name: The base stack composes
        run: docker compose -f docker-compose.yml config --quiet

      - name: The overlay refuses to resolve without its secrets
        # The point of ${VAR:?message} is that a missing secret stops the
        # deploy instead of starting it on a development default. That is only
        # worth having if something checks it still fires — and checks it
        # fires for each secret on its own, since one guard covering for a
        # missing sibling is exactly the failure this would miss.
        run: |
          set +e
          status=0
          for missing in SECRET_KEY POSTGRES_PASSWORD; do
            # Set both, then unset the one under test, in a subshell. Not
            # `env -u NAME NAME=value`: env applies -u before the assignment,
            # so the variable would arrive set and this would test nothing.
            output=$(
              export SECRET_KEY=ci-secret-not-used-in-production-0123456789
              export POSTGRES_PASSWORD=ci-postgres-password
              unset "$missing"
              docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
                config 2>&1
            )
            if [ $? -eq 0 ]; then
              echo "::error::The overlay resolved with no ${missing}"
              status=1
              continue
            fi
            if ! grep -q "required variable ${missing} is missing a value" <<< "$output"; then
              echo "::error::The overlay was rejected, but not for the missing ${missing}"
              echo "$output"
              status=1
              continue
            fi
            echo "Missing ${missing} rejected as expected."
          done
          exit $status

      - name: The overlay resolves once they are set
        run: |
          SECRET_KEY=ci-secret-not-used-in-production-0123456789 \
          POSTGRES_PASSWORD=ci-postgres-password \
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
            config --quiet

      - name: Caddy accepts the site config
        # The file is a site block meant to be imported from the main
        # Caddyfile, and validates standalone as one. A syntax error here is a
        # `systemctl reload caddy` that refuses, taking every other site on the
        # box down with it.
        run: |
          docker run --rm \
            -v "$PWD/deploy/caflow.aiknol.com.caddy:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: The backup script is valid POSIX sh
        # It runs as root, from a timer, unattended, and its output is the only
        # copy of a CA firm's records. `sh -n` is cheap next to that.
        run: |
          sh -n deploy/caflow-backup.sh
          shellcheck --shell=sh deploy/caflow-backup.sh

      - name: The systemd units parse
        # systemd-analyze verify resolves a unit the way systemd will, which
        # catches the typo class these files are most exposed to — a misspelled
        # directive is accepted silently by everything else until the deploy.
        #
        # It also reports what it cannot resolve *on the runner*: caddy.service
        # is not installed here, and /usr/local/bin/caflow-backup is only in
        # place on the real host. Those make it exit non-zero every time, so
        # the exit code says nothing and only the parse diagnostics are read.
        run: |
          set +e
          status=0
          for unit in deploy/caflow.service deploy/caflow-backup.service deploy/caflow-backup.timer; do
            echo "--- ${unit} ---"
            output=$(systemd-analyze verify "$unit" 2>&1)
            echo "$output"
            if grep -qiE 'unknown lvalue|invalid value|failed to parse|bad setting|ignoring' <<< "$output"; then
              echo "::error::${unit} has a directive systemd does not understand"
              status=1
            fi
          done
          exit $status

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: a new advisory against a dependency should be visible without
    # blocking an unrelated change from merging.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        working-directory: frontend
        # Known and accepted: react-router >=7.12 carries an RSC-mode CSRF
        # advisory. This is a client-rendered SPA with no RSC and no server
        # actions, and every 6.x release plus 7.11 carries the open-redirect
        # advisory against <Link>/useNavigate, which the app does use.
        run: npm audit --audit-level=high || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
