# The whole CAFlow stack.
#
#   docker compose up -d                   # everything, migrated and seeded
#   docker compose up -d postgres redis    # just the backing services, for
#                                          # running the API on the host
#
# Every setting below has a working default, so a fresh clone comes up without
# a .env file. Anything you do set — SECRET_KEY, SMTP, the OpenRouter key — is
# read from the shell or from a .env beside this file.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  LOG_JSON: ${LOG_JSON:-false}
  LOG_LEVEL: ${LOG_LEVEL:-}
  # Service names, not localhost: these are container-to-container.
  DATABASE_URL: postgresql+psycopg://caflow:${POSTGRES_PASSWORD:-caflow}@postgres:5432/caflow
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # nginx serves the app and proxies the API, so one origin covers both.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8080/portal}
  STORAGE_DIR: /var/lib/caflow/documents
  # nginx sets X-Forwarded-For, so the rate limiter can trust it here. The
  # header is still only believed from a peer inside TRUSTED_PROXY_IPS, whose
  # default already covers the private range the compose network sits on —
  # left unset here so an empty value cannot silently mean "trust nobody".
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@caflow.local}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CAFlow}

x-backend: &backend
  build:
    context: ./backend
  image: caflow-backend:latest
  environment: *backend-env
  volumes:
    # Uploads must be visible to the API that stores them and to the worker
    # that categorises them, so the volume is shared rather than per-container.
    - caflow_documents:/var/lib/caflow/documents
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: caflow-postgres
    environment:
      POSTGRES_USER: caflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caflow}
      POSTGRES_DB: caflow
    ports:
      # Published on 5434 so it does not collide with a local server, and bound
      # to loopback so it is reachable from this machine and nowhere else. A
      # bare "5434:5432" listens on every interface, which on a laptop is the
      # database on the coffee-shop wifi and in production is the database on
      # the internet — in both cases behind a password that ships in this file.
      - "127.0.0.1:5434:5432"
    volumes:
      - caflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: caflow-redis
    ports:
      # Loopback only, for the same reason as postgres above — and Redis has no
      # password at all.
      - "127.0.0.1:6381:6379"
    volumes:
      - caflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: migrate, then load the statutory compliance calendar. Everything
  # else waits for this, so no process ever meets a half-built schema.
  migrate:
    <<: *backend
    container_name: caflow-migrate
    command: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    container_name: caflow-api
    command: ["api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The API port is deliberately not published. nginx already proxies /docs,
    # /health and the API itself on 8080, so publishing 8000 added no reach —
    # it only added a way to bypass the proxy and hand the app an
    # X-Forwarded-For of one's choosing. Reach it directly with
    # `docker compose exec api ...` when debugging.
    expose:
      - "8000"
    # SIGTERM makes uvicorn stop accepting connections and finish what it is
    # holding. Docker's default is ten seconds, which is under the API's own
    # slowest path, so a deploy would cut a document upload in half.
    stop_grace_period: 30s

  worker:
    <<: *backend
    container_name: caflow-worker
    command: ["worker"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Celery's SIGTERM is a warm shutdown: no new tasks, finish the running
    # one. A whole reminder batch will not fit in any grace period worth
    # waiting, and it does not have to — the dispatcher commits each delivery
    # as it happens, so an interrupted batch resumes rather than restarts. What
    # this window has to cover is the *one* send in flight, and its SMTP
    # timeout alone is twenty seconds. At Docker's default ten, the deploy
    # SIGKILLs a worker that has just handed a message to the relay and not yet
    # recorded it, and `task_acks_late` sends it again on redelivery.
    stop_grace_period: 60s

  # Beat only enqueues; it holds no state worth persisting beyond its schedule.
  beat:
    <<: *backend
    container_name: caflow-beat
    command: ["beat"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
    image: caflow-web:latest
    container_name: caflow-web
    ports:
      # Loopback, because in production Caddy terminates TLS in front of this
      # and is the only thing that should reach it. Published on every
      # interface, the plaintext port answers the internet directly — which is
      # the app without HSTS, without the certificate, and with an
      # X-Forwarded-For of the caller's choosing.
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caflow_pgdata:
  caflow_redisdata:
  caflow_documents:
