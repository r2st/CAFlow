services:
  postgres:
    image: postgres:16-alpine
    container_name: caflow-postgres
    environment:
      POSTGRES_USER: caflow
      POSTGRES_PASSWORD: caflow
      POSTGRES_DB: caflow
    ports:
      - "5434:5432"
    volumes:
      - caflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: caflow-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caflow_pgdata:
