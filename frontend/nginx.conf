# Serves the built SPA and proxies the API, so the browser only ever talks to
# one origin. TLS terminates in front of this (a load balancer or a reverse
# proxy on the host), which is where HSTS belongs too.

upstream caflow_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped here as well as in the app: rejecting an oversized
    # body at the edge means it never reaches a Python worker at all.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # For the container's own healthcheck; never proxied.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://caflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document uploads and AI categorisation can outrun the default 60s.
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Health and API reference sit outside /api by design.
    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass http://caflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every other path is the app shell. index.html itself
    # must never be cached, or a deploy leaves browsers on the old bundle.
    #
    # The security headers are repeated rather than set once on the server
    # block: nginx drops inherited add_header directives in any block that
    # declares one of its own, and this block needs Cache-Control.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
