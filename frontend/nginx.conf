# Serves the built SPA and proxies the API, so the browser only ever talks to
# one origin. TLS terminates in front of this (a load balancer or a reverse
# proxy on the host), which is where HSTS belongs too.

upstream caflow_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped here as well as in the app: rejecting an oversized
    # body at the edge means it never reaches a Python worker at all.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # For the container's own healthcheck; never proxied.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://caflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document uploads and AI categorisation can outrun the default 60s.
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Health and API reference sit outside /api by design.
    #
    # The reference is proxied here but not necessarily served: the app routes
    # /docs, /redoc and /openapi.json only when `settings.serves_api_docs` says
    # so, which is false under ENVIRONMENT=production. The gate belongs there
    # rather than here — it is the layer that knows which environment it is,
    # and it covers the shared-box deployment (deploy/hetzner), which does not
    # use this file at all. Blocking them here as well would take the reference
    # away from `docker compose up` on a laptop, which is where it is read.
    location ~ ^/(health|docs|redoc|openapi\.json) {
        proxy_pass http://caflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames, so these can be cached indefinitely. nosniff is
    # repeated here for the same reason it is repeated below: declaring any
    # add_header in a block drops every one it would have inherited, and these
    # are the script and stylesheet themselves — the files whose content type
    # most needs to be taken at its word.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routing: every other path is the app shell. index.html itself
    # must never be cached, or a deploy leaves browsers on the old bundle.
    #
    # The security headers are repeated rather than set once on the server
    # block: nginx drops inherited add_header directives in any block that
    # declares one of its own, and this block needs Cache-Control. Setting them
    # on the server block instead would also reach /docs, whose Swagger UI
    # loads from a CDN and runs inline script — the CSP below would break it.
    #
    # The policy is what the built app actually needs and nothing more. The
    # bundle is one hashed script and one hashed stylesheet from this origin,
    # so 'self' covers scripts outright; `style-src` needs 'unsafe-inline'
    # only because React writes `style` attributes, which is a far narrower
    # hole than an inline <style> or <script> would be. `connect-src 'self'`
    # holds because nginx fronts the API on this same origin — that is the
    # point of proxying it here. If any of that stops being true, the CSP is
    # what will say so, loudly, rather than the app quietly gaining a new
    # place to exfiltrate a JWT to.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # Nothing here uses a camera, a microphone, a location or a payment
        # handler. Saying so denies them to anything that ends up embedded.
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    }
}
